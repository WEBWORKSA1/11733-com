name: Auto-refresh site

# Re-stamps the "content reviewed" date weekly so GitHub Pages rebuilds the site
# (refreshes sitemap lastmod and the review dates shown on every page).
on:
  schedule:
    - cron: "33 7 * * 1"   # Mondays 07:33 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update build date
        run: |
          printf 'updated: "%s"\n' "$(date -u +%Y-%m-%d)" > _data/build.yml
      - name: Commit if changed
        run: |
          git config user.name "11733-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/build.yml
          git diff --cached --quiet || git commit -m "chore: weekly auto-refresh"
          git push
